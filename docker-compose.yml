services:
  caddy:
    image: caddy:2
    container_name: factoria-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: always

  backend:
    build: ./backend
    container_name: factoria-backend
    expose:
      - "8085"
    environment:
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - N8N_API_KEY=${N8N_API_KEY}
      - APP_URL=${APP_URL}
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
    container_name: factoria-frontend
    expose:
      - "3000"
    depends_on:
      - backend
    restart: always

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: factoria-n8n
    ports:
      - "5678:5678"
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - backend
    restart: always

volumes:
  n8n_data:
  caddy_data:
  caddy_config: