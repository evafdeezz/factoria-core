spring.application.name=factoria-core-backend
server.port=8085
spring.jackson.serialization.write-dates-as-timestamps=false

# ========================
# DATABASE (SUPABASE)
# ========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ========================
# GOOGLE OAUTH
# ========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${BACKEND_URL}/login/oauth2/code/{registrationId}

# ========================
# SESSION CONFIG
# ========================
server.servlet.session.cookie.same-site=lax
n8n.api-key=${N8N_API_KEY}

app.frontend-url=${FRONTEND_URL}
app.backend-url=${BACKEND_URL}